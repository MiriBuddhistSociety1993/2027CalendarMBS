<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f5f3ed">

<title>美里佛教居士林｜2027 年活动日历</title>

<style>
:root {
  --green: #356b5b;
  --light-green: #e8f0e8;
  --ink: #263d36;
  --muted: #77847c;
  --line: #e7e4da;
  --bg: #f7f5ee;
  --gold: #c5a16b;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
  letter-spacing: .01em;
}

/* ===== Header ===== */

header {
  min-height: 390px;
  position: relative;
  isolation: isolate;
  display: flex;
  flex-direction: column;
  align-items: stretch;
  justify-content: flex-start;
  gap: 0;
  padding: 28px clamp(20px, 6vw, 88px) 42px;
  color: var(--green);
  text-align: left;
  overflow: hidden;

  background:
    linear-gradient(
      90deg,
      rgba(250,249,241,.99) 0%,
      rgba(250,249,241,.94) 30%,
      rgba(250,249,241,.55) 53%,
      rgba(250,249,241,.08) 100%
    ),
    linear-gradient(
      0deg,
      rgba(247,245,238,.28),
      rgba(247,245,238,0) 40%
    ),
    url("./main-building.png") center 47% / cover no-repeat;
}

header::before {
  content: "";
  position: absolute;
  z-index: -1;
  inset: auto 0 0;
  height: 46px;
  background: linear-gradient(
    180deg,
    transparent,
    rgba(247,245,238,.88)
  );
}

header::after {
  content: "";
  position: absolute;
  z-index: -1;
  inset: auto 0 0;
  height: 3px;
  background: rgba(177,158,119,.5);
}

.brand-row {
  display: flex;
  align-items: center;
  gap: 20px;
  max-width: 760px;
}

.logo-frame {
  width: 104px;
  height: 104px;
  flex: 0 0 104px;
  padding: 5px;
  border-radius: 50%;
  background: rgba(255,255,250,.88);
  box-shadow: 0 5px 22px rgba(52,75,62,.10);
  overflow: hidden;
}

.site-logo {
  width: 100%;
  height: 100%;
  object-fit: contain;
}

.header-text {
  min-width: 0;
}

header h1 {
  margin: 0;
  color: #285849;
  font-family: "Noto Serif SC", "Songti SC", "SimSun", serif;
  font-size: clamp(28px, 3.5vw, 43px);
  font-weight: 700;
  line-height: 1.3;
  letter-spacing: .06em;
}

header p {
  margin: 8px 0 0;
  color: #567064;
  font-size: 14px;
  line-height: 1.8;
}

header .english-name {
  font-size: 11px;
  letter-spacing: .09em;
  color: #60766a;
}

header .motto {
  margin-top: 7px;
  font-size: 13px;
  letter-spacing: .28em;
  color: #9a8158;
}

.hero-caption {
  max-width: 650px;
  margin-top: 54px;
  padding-left: 4px;
  color: #2c5d4d;
}

.hero-kicker {
  font-size: 14px;
  letter-spacing: .18em;
  color: #718a78;
  margin-bottom: 10px;
}

.hero-caption h2 {
  margin: 0;
  font-family: "Noto Serif SC", "Songti SC", "SimSun", serif;
  font-size: clamp(34px, 5vw, 58px);
  line-height: 1.2;
  letter-spacing: .05em;
  font-weight: 700;
  color: #285849;
}

.hero-caption p {
  color: #5f7769;
  font-size: 15px;
  margin-top: 15px;
}

/* ===== Main layout ===== */

main {
  max-width: 1500px;
  margin: -8px auto 0;
  padding: 0 24px 48px;
  position: relative;
}

.toolbar {
  display: flex;
  flex-wrap: wrap;
  gap: 14px;
  align-items: center;
  justify-content: space-between;
  background: rgba(255,254,250,.96);
  padding: 15px 18px;
  border: 1px solid rgba(226,222,210,.95);
  border-radius: 18px;
  margin-bottom: 18px;
  box-shadow: 0 8px 28px rgba(48,58,54,.045);
}

.controls {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
}

button,
input {
  font: inherit;
  border: 1px solid #dedfd5;
  border-radius: 11px;
  padding: 10px 14px;
  background: #fffefa;
  color: var(--ink);
  transition:
    border-color .18s ease,
    background .18s ease,
    transform .18s ease;
}

button {
  cursor: pointer;
}

button:hover {
  border-color: #9aaf9f;
}

button:active {
  transform: translateY(1px);
}

button.primary {
  background: var(--green);
  border-color: var(--green);
  color: #fffdf7;
}

button.primary:hover {
  background: #2d5b4d;
}

button:disabled {
  opacity: .6;
  cursor: wait;
}

#monthLabel {
  color: #3c594c;
  font-size: 19px;
  font-weight: 700;
  min-width: 135px;
  text-align: center;
}

.layout {
  display: grid;
  grid-template-columns: minmax(0, 1.55fr) minmax(320px, 1fr);
  gap: 18px;
}

.panel {
  background: rgba(255,254,250,.97);
  border: 1px solid #e6e2d8;
  border-radius: 18px;
  overflow: hidden;
  box-shadow: 0 8px 28px rgba(48,58,54,.045);
  min-width: 0;
}

.panel-head {
  padding: 17px 20px;
  background: #fbfaf6;
  border-bottom: 1px solid #ebe8de;
  display: flex;
  justify-content: space-between;
  gap: 10px;
  align-items: center;
}

.panel-head h2 {
  margin: 0;
  color: #355d4d;
  font-size: 17px;
  letter-spacing: .04em;
}

.status {
  font-size: 12px;
  color: #858b83;
}

/* ===== Calendar ===== */

.calendar {
  padding: 14px;
}

.weekdays,
.days {
  display: grid;
  grid-template-columns: repeat(7, minmax(0, 1fr));
  gap: 6px;
}

.weekdays div {
  text-align: center;
  color: #81877e;
  font-size: 12px;
  letter-spacing: .08em;
  padding: 9px 0 11px;
}

.weekdays div:first-child {
  color: #b27d70;
}

.day {
  border: 1px solid #eeece4;
  min-height: 104px;
  border-radius: 11px;
  padding: 8px;
  background: #fffefa;
  cursor: pointer;
  overflow: hidden;
  min-width: 0;
  transition:
    border-color .16s ease,
    background .16s ease,
    box-shadow .16s ease;
}

.day:hover {
  border-color: #b7c7b8;
  background: #fafbf7;
}

.day.outside {
  background: #f7f6f1;
  color: #b8b9b1;
}

.day.today {
  border: 2px solid #c7a46f;
}

.day.selected {
  background: #edf2eb;
  border-color: #668675;
  box-shadow: inset 0 0 0 1px rgba(102,134,117,.12);
}

.daynum {
  color: #4c574f;
  font-size: 13px;
  font-weight: 700;
  margin-bottom: 7px;
}

.event-chip {
  display: block;
  background: #e9f0e9;
  color: #456452;
  border-left: 3px solid #8ca692;
  border-radius: 5px;
  padding: 4px 5px;
  margin: 4px 0;
  font-size: 11px;
  line-height: 1.3;
  overflow-wrap: anywhere;
}

.event-chip.more {
  background: #f3f0e8;
  color: #817660;
  border-left-color: #c8b58f;
}

/* ===== Event list ===== */

.side-content {
  padding: 17px;
}

.event-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.event {
  border: 1px solid #e8e5dc;
  border-radius: 12px;
  padding: 14px;
  background: #fffefa;
}

.event h3 {
  margin: 5px 0;
  color: #3f5c4d;
  font-size: 15px;
  line-height: 1.5;
}

.event p {
  margin: 4px 0;
  color: #586270;
  font-size: 13px;
  line-height: 1.65;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.event .date {
  font-size: 12px;
  font-weight: 700;
  color: #64806d;
}

.empty {
  padding: 25px 10px;
  text-align: center;
  color: #8a8e86;
}

.error {
  margin: 12px 0;
  padding: 12px 14px;
  background: #fff1f0;
  color: #9f2d25;
  border: 1px solid #ffd2ce;
  border-radius: 10px;
  display: none;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.footnote {
  color: var(--muted);
  font-size: 12px;
  margin-top: 14px;
  padding: 12px 13px;
  background: #f7f5ef;
  border-radius: 10px;
  line-height: 1.8;
}

.pill {
  display: inline-block;
  font-size: 10px;
  border-radius: 20px;
  padding: 2px 6px;
  background: #f4eadb;
  color: #86591c;
  margin-left: 3px;
}

footer {
  padding: 22px 16px 30px;
  text-align: center;
  background: #e9e8df;
  color: #7b8078;
  font-size: 12px;
  line-height: 1.8;
}

@media(max-width: 850px) {
  header {
    min-height: 330px;
    padding: 25px 22px 36px;
    background-position: 58% center;
  }

  .hero-caption {
    margin-top: 42px;
  }

  .layout {
    grid-template-columns: 1fr;
  }

  .day {
    min-height: 84px;
  }
}

@media(max-width: 520px) {
  header {
    min-height: 300px;
    padding: 20px 14px 32px;
    background-position: 61% center;
  }

  .brand-row {
    gap: 11px;
  }

  .logo-frame {
    width: 66px;
    height: 66px;
    flex-basis: 66px;
    padding: 3px;
  }

  header h1 {
    font-size: 22px;
    letter-spacing: .02em;
  }

  header p {
    font-size: 11px;
    margin-top: 5px;
  }

  header .english-name {
    font-size: 8px;
  }

  header .motto {
    font-size: 10px;
    letter-spacing: .12em;
  }

  .hero-caption {
    margin-top: 42px;
    max-width: 85%;
  }

  .hero-kicker {
    font-size: 10px;
    letter-spacing: .08em;
  }

  .hero-caption h2 {
    font-size: 30px;
  }

  .hero-caption p {
    font-size: 12px;
    line-height: 1.6;
  }

  main {
    padding: 0 10px 30px;
    margin-top: 10px;
  }

  .toolbar {
    padding: 11px;
    border-radius: 14px;
  }

  .panel {
    border-radius: 14px;
  }

  .calendar {
    padding: 6px;
  }

  .day {
    min-height: 67px;
    padding: 4px;
  }

  .event-chip {
    font-size: 9px;
  }

  .weekdays,
  .days {
    gap: 3px;
  }
}
</style>
</head>

  <div class="toolbar">

<script>
"use strict";

/* =========================================================
   Google Sheets CSV
   ========================================================= */

const ACTIVITY_CSV_URL =
  "https://docs.google.com/spreadsheets/d/e/2PACX-1vTcmNKJ322HzGxtlRqsQNQ-1DLRq-LXcivKuWEt7DWfXnf_EpofCpUkzbL9FUvK_WSxH0RaHbsCs5mY/pub?gid=1830432104&single=true&output=csv";

const DATE_INFO_CSV_URL =
  "https://docs.google.com/spreadsheets/d/e/2PACX-1vTcmNKJ322HzGxtlRqsQNQ-1DLRq-LXcivKuWEt7DWfXnf_EpofCpUkzbL9FUvK_WSxH0RaHbsCs5mY/pub?gid=688612611&single=true&output=csv";

/* =========================================================
   Application state
   ========================================================= */

let activities = [];
let dateInfo = [];

let viewDate = new Date(2027, 0, 1);
let selectedDate = "";
let searchTerm = "";

const $ = id => document.getElementById(id);

const clean = value =>
  String(value ?? "")
    .replace(/^\uFEFF/, "")
    .trim();

const norm = value =>
  clean(value)
    .toLowerCase()
    .replace(/[\s_\-()（）:：/？?]+/g, "");

/* =========================================================
   General utilities
   ========================================================= */

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, character => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  })[character]);
}

/* CSV parser supporting quoted commas, line breaks and quotes */

function parseCSV(text) {
  const rows = [];

  let row = [];
  let field = "";
  let quoted = false;

  text = String(text ?? "").replace(/^\uFEFF/, "");

  for (let i = 0; i < text.length; i++) {
    const character = text[i];

    if (quoted) {
      if (
        character === '"' &&
        text[i + 1] === '"'
      ) {
        field += '"';
        i++;
      } else if (character === '"') {
        quoted = false;
      } else {
        field += character;
      }
    } else {
      if (
        character === '"' &&
        field === ""
      ) {
        quoted = true;
      } else if (character === ",") {
        row.push(field);
        field = "";
      } else if (
        character === "\n" ||
        character === "\r"
      ) {
        if (
          character === "\r" &&
          text[i + 1] === "\n"
        ) {
          i++;
        }

        row.push(field);

        if (row.some(value => clean(value) !== "")) {
          rows.push(row);
        }

        row = [];
        field = "";
      } else {
        field += character;
      }
    }
  }

  row.push(field);

  if (row.some(value => clean(value) !== "")) {
    rows.push(row);
  }

  return rows;
}

/* =========================================================
   Date utilities
   ========================================================= */

function validDate(year, month, day) {
  const date = new Date(year, month - 1, day);

  return (
    date.getFullYear() === year &&
    date.getMonth() === month - 1 &&
    date.getDate() === day
  )
    ? date
    : null;
}

function parseDate(value) {
  const text = clean(value);

  if (!text) {
    return null;
  }

  let match;

  /*
    yyyy-mm-dd
    yyyy/mm/dd
    yyyy.mm.dd
  */

  match = text.match(
    /^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})(?:$|T|\s)/
  );

  if (match) {
    return validDate(
      Number(match[1]),
      Number(match[2]),
      Number(match[3])
    );
  }

  /*
    Malaysian format:
    dd/mm/yyyy
    dd-mm-yyyy
    dd.mm.yyyy
  */

  match = text.match(
    /^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})$/
  );

  if (match) {
    return validDate(
      Number(match[3]),
      Number(match[2]),
      Number(match[1])
    );
  }

  const months = {
    jan: 0,
    january: 0,
    feb: 1,
    february: 1,
    mar: 2,
    march: 2,
    apr: 3,
    april: 3,
    may: 4,
    jun: 5,
    june: 5,
    jul: 6,
    july: 6,
    aug: 7,
    august: 7,
    sep: 8,
    sept: 8,
    september: 8,
    oct: 9,
    october: 9,
    nov: 10,
    november: 10,
    dec: 11,
    december: 11
  };

  /*
    13-Feb-27
    13 Feb 2027
  */

  match = text.match(
    /^(\d{1,2})[\s\-\/]([A-Za-z]{3,9})[\s,\-\/]+(\d{2,4})$/
  );

  if (
    match &&
    months[match[2].toLowerCase()] !== undefined
  ) {
    let year = Number(match[3]);

    if (year < 100) {
      year += year < 50 ? 2000 : 1900;
    }

    return validDate(
      year,
      months[match[2].toLowerCase()] + 1,
      Number(match[1])
    );
  }

  /*
    Feb 13, 2027
  */

  match = text.match(
    /^([A-Za-z]{3,9})\s+(\d{1,2}),?\s+(\d{4})$/
  );

  if (
    match &&
    months[match[1].toLowerCase()] !== undefined
  ) {
    return validDate(
      Number(match[3]),
      months[match[1].toLowerCase()] + 1,
      Number(match[2])
    );
  }

  /*
    Google Sheets serial date
  */

  if (/^\d{5}(?:\.0+)?$/.test(text)) {
    const serialDate = new Date(
      Date.UTC(1899, 11, 30) +
      Math.floor(Number(text)) * 86400000
    );

    return validDate(
      serialDate.getUTCFullYear(),
      serialDate.getUTCMonth() + 1,
      serialDate.getUTCDate()
    );
  }

  /*
    Final browser date fallback
  */

  const parsedDate = new Date(text);

  if (!isNaN(parsedDate)) {
    return validDate(
      parsedDate.getFullYear(),
      parsedDate.getMonth() + 1,
      parsedDate.getDate()
    );
  }

  return null;
}

function dateKey(date) {
  return [
    date.getFullYear(),
    String(date.getMonth() + 1).padStart(2, "0"),
    String(date.getDate()).padStart(2, "0")
  ].join("-");
}

function fromKey(key) {
  const match = String(key).match(
    /^(\d{4})-(\d{2})-(\d{2})$/
  );

  return match
    ? new Date(
        Number(match[1]),
        Number(match[2]) - 1,
        Number(match[3])
      )
    : null;
}

function addDays(date, number) {
  const result = new Date(date);
  result.setDate(result.getDate() + number);

  return result;
}

/*
  Add calendar months while handling dates such as:
  29, 30 and 31.
*/

function addMonthsClamped(
  date,
  numberOfMonths,
  preferredDay
) {
  const target = new Date(
    date.getFullYear(),
    date.getMonth() + numberOfMonths,
    1
  );

  const lastDayOfMonth = new Date(
    target.getFullYear(),
    target.getMonth() + 1,
    0
  ).getDate();

  target.setDate(
    Math.min(preferredDay, lastDayOfMonth)
  );

  return target;
}

/* =========================================================
   Convert CSV rows into objects
   ========================================================= */

function rowsToObjects(rows) {
  if (!rows.length) {
    return [];
  }

  let headerRow = 0;
  let bestScore = -1;

  /*
    Locate likely header row.
    This allows title rows above the table.
  */

  for (
    let rowIndex = 0;
    rowIndex < Math.min(rows.length, 20);
    rowIndex++
  ) {
    const cells = rows[rowIndex].map(norm);

    const score = cells.filter(cell =>
      /activity|event|活动|title|名称|startdate|开始日期|date|日期/.test(
        cell
      )
    ).length;

    if (score > bestScore) {
      bestScore = score;
      headerRow = rowIndex;
    }
  }

  const headers = rows[headerRow].map(clean);

  return rows
    .slice(headerRow + 1)
    .filter(row =>
      row.some(value => clean(value) !== "")
    )
    .map(row => {
      const object = {};

      headers.forEach((header, index) => {
        if (header) {
          object[header] = clean(row[index]);
        }
      });

      return object;
    });
}

function getValue(object, patterns) {
  const entry = Object.entries(object).find(
    ([key, value]) =>
      patterns.some(pattern =>
        pattern.test(norm(key))
      ) &&
      clean(value) !== ""
  );

  return entry
    ? clean(entry[1])
    : "";
}

/* =========================================================
   Read activities
   ========================================================= */

function detectActivities(rows) {
  const objects = rowsToObjects(rows);

  return objects
    .map((object, index) => {

      const title = getValue(object, [
        /^(activity|event|活动名称|活动|title|name|eventname|activityname)$/,
        /activityname/,
        /eventname/,
        /活动名称/
      ]);

      const startRaw = getValue(object, [
        /^(startdate|start|date|日期|开始日期|活动日期|eventdate)$/,
        /startdate/,
        /开始日期/,
        /活动日期/,
        /^date$/
      ]);

      const endRaw = getValue(object, [
        /^(enddate|end|结束日期)$/,
        /enddate/,
        /结束日期/
      ]);

      const enabled = getValue(object, [
        /^(enabled|active|status|启用|状态|是否启用)$/,
        /enabled/,
        /active/,
        /启用/
      ]);

      const category = getValue(object, [
        /^(category|type|类别|类型|分类|活动类别)$/,
        /category/,
        /活动类别/,
        /类别/,
        /类型/
      ]);

      const location = getValue(object, [
        /^(location|venue|地点|场地)$/,
        /location/,
        /venue/,
        /地点/,
        /场地/
      ]);

      const owner = getValue(object, [
        /^(owner|personincharge|负责人|负责人单位|负责人员|联系人)$/,
        /owner/,
        /负责人/,
        /联系人/
      ]);

      const description = getValue(object, [
        /^(description|details|备注|说明|内容)$/,
        /description/,
        /details/,
        /备注/,
        /说明/
      ]);

      /*
        Read the “频率” column.
      */

      const recurrence = getValue(object, [
        /^(frequency|freq|recurrence|repeat|频率|重复|重复规则)$/,
        /frequency/,
        /recurrence/,
        /repeat/,
        /频率/,
        /重复规则/
      ]);

      /*
        Read “重复至” independently
        from “结束日期”.
      */

      const repeatUntilRaw = getValue(object, [
        /^(repeatuntil|repeatend|recurrenceend|until|重复至|重复结束日期)$/,
        /repeatuntil/,
        /repeatend/,
        /recurrenceend/,
        /重复至/,
        /重复结束日期/
      ]);

      const start = parseDate(startRaw);
      const end = parseDate(endRaw) || start;

      const repeatUntil =
        parseDate(repeatUntilRaw);

      if (!title || !start) {
        return null;
      }

      /*
        Exclude explicitly disabled activities.
        Blank “启用?” remains enabled.
      */

      if (
        /^(false|no|n|0|inactive|disabled|否|停用)$/i.test(
          enabled
        )
      ) {
        return null;
      }

      return {
        id: "a" + index,
        title,
        start,
        end,
        category,
        location,
        owner,
        description,
        recurrence,
        repeatUntil
      };
    })
    .filter(Boolean);
}
