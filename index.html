<script>

"use strict";


/* =========================================================
   GOOGLE SHEETS
   ========================================================= */

/*
IMPORTANT:

将你原本“可以正常载入”的两个CSV URL
放回下面两个位置。

不要使用 <a href="...">。
只放纯URL字符串。
*/

const ACTIVITY_CSV_URL =
  "https://docs.google.com/spreadsheets/d/e/2PACX-1vTcmNKJ322HzGxtlRqsQNQ-1DLRq-LXcivKuWEt7DWfXnf_EpofCpUkzbL9FUvK_WSxH0RaHbsCs5mY/pub?gid=1830432104&single=true&output=csv";

const DATE_INFO_CSV_URL =
  "https://docs.google.com/spreadsheets/d/e/2PACX-1vTcmNKJ322HzGxtlRqsQNQ-1DLRq-LXcivKuWEt7DWfXnf_EpofCpUkzbL9FUvK_WSxH0RaHbsCs5mY/pub?gid=688612611&single=true&output=csv";


/* =========================================================
   STATE
   ========================================================= */

let activities = [];

let dateInfo = [];

let viewDate =
  new Date(
    2027,
    0,
    1
  );

let selectedDate = "";

let searchTerm = "";


const $ =
  id =>
    document.getElementById(id);


const clean =
  value =>
    String(
      value ?? ""
    )
    .replace(
      /^\uFEFF/,
      ""
    )
    .trim();


const norm =
  value =>
    clean(value)
    .toLowerCase()
    .replace(
      /[\s_\-()（）:：/]+/g,
      ""
    );


/* =========================================================
   HTML SAFETY
   ========================================================= */

function escapeHTML(value) {

  return String(
    value ?? ""
  ).replace(
    /[&<>"']/g,

    character => ({

      "&": "&amp;",

      "<": "&lt;",

      ">": "&gt;",

      '"': "&quot;",

      "'": "&#39;"

    })[character]
  );
}



/* =========================================================
   CSV PARSER
   ========================================================= */

function parseCSV(text) {

  const rows = [];

  let row = [];

  let field = "";

  let quoted = false;


  text =
    String(
      text ?? ""
    )
    .replace(
      /^\uFEFF/,
      ""
    );


  for (
    let index = 0;
    index < text.length;
    index++
  ) {

    const character =
      text[index];


    if (quoted) {


      if (
        character === '"' &&
        text[index + 1] === '"'
      ) {

        field += '"';

        index++;

      }

      else if (
        character === '"'
      ) {

        quoted = false;

      }

      else {

        field += character;

      }

    }


    else {


      if (
        character === '"' &&
        field === ""
      ) {

        quoted = true;

      }


      else if (
        character === ","
      ) {

        row.push(field);

        field = "";

      }


      else if (
        character === "\n" ||
        character === "\r"
      ) {


        if (
          character === "\r" &&
          text[index + 1] === "\n"
        ) {

          index++;

        }


        row.push(field);


        if (
          row.some(
            value =>
              clean(value) !== ""
          )
        ) {

          rows.push(row);

        }


        row = [];

        field = "";

      }


      else {

        field += character;

      }

    }

  }


  row.push(field);


  if (
    row.some(
      value =>
        clean(value) !== ""
    )
  ) {

    rows.push(row);

  }


  return rows;

}



/* =========================================================
   DATE
   IMPORTANT:
   THIS IS YOUR ORIGINAL WORKING LOGIC.
   ========================================================= */

function validDate(
  year,
  month,
  day
) {

  const date =
    new Date(
      year,
      month - 1,
      day
    );


  return (

    date.getFullYear() === year &&

    date.getMonth() ===
      month - 1 &&

    date.getDate() === day

  )

    ? date

    : null;

}



/*
Common date formats used by Google Sheets.
*/

function parseDate(value) {
  const s = clean(value);

  if (!s) return null;

  let m;

  // yyyy-mm-dd, yyyy/mm/dd or yyyy.mm.dd
  m = s.match(
    /^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})(?:$|T|\s)/
  );

  if (m) {
    return validDate(
      +m[1],
      +m[2],
      +m[3]
    );
  }

  // dd/mm/yyyy, dd-mm-yyyy or dd.mm.yyyy
  m = s.match(
    /^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})$/
  );

  if (m) {
    return validDate(
      +m[3],
      +m[2],
      +m[1]
    );
  }

  const months = {
    jan: 0,
    january: 0,

    feb: 1,
    february: 1,

    mar: 2,
    march: 2,

    apr: 3,
    april: 3,

    may: 4,

    jun: 5,
    june: 5,

    jul: 6,
    july: 6,

    aug: 7,
    august: 7,

    sep: 8,
    sept: 8,
    september: 8,

    oct: 9,
    october: 9,

    nov: 10,
    november: 10,

    dec: 11,
    december: 11
  };

  // 13-Feb-27 or 13 Feb 2027
  m = s.match(
    /^(\d{1,2})[\s\-\/]([A-Za-z]{3,9})[\s,\-\/]+(\d{2,4})$/
  );

  if (
    m &&
    months[m[2].toLowerCase()] !== undefined
  ) {
    let year = +m[3];

    if (year < 100) {
      year += year < 50 ? 2000 : 1900;
    }

    return validDate(
      year,
      months[m[2].toLowerCase()] + 1,
      +m[1]
    );
  }

  // Feb 13, 2027
  m = s.match(
    /^([A-Za-z]{3,9})\s+(\d{1,2}),?\s+(\d{4})$/
  );

  if (
    m &&
    months[m[1].toLowerCase()] !== undefined
  ) {
    return validDate(
      +m[3],
      months[m[1].toLowerCase()] + 1,
      +m[2]
    );
  }

  // Google Sheets serial date
  if (/^\d{5}(?:\.0+)?$/.test(s)) {
    const d = new Date(
      Date.UTC(1899, 11, 30) +
      Math.floor(Number(s)) * 86400000
    );

    return validDate(
      d.getUTCFullYear(),
      d.getUTCMonth() + 1,
      d.getUTCDate()
    );
  }

  const parsed = new Date(s);

  if (!isNaN(parsed.getTime())) {
    return validDate(
      parsed.getFullYear(),
      parsed.getMonth() + 1,
      parsed.getDate()
    );
  }

  return null;
}



/* =========================================================
   DATE UTILITIES
   ========================================================= */

function dateKey(date) {

  return (

    `${date.getFullYear()}-`

    +

    `${String(
      date.getMonth() + 1
    ).padStart(2, "0")}-`

    +

    `${String(
      date.getDate()
    ).padStart(2, "0")}`

  );

}



function fromKey(key) {

  const match =
    String(key)
    .match(
      /^(\d{4})-(\d{2})-(\d{2})$/
    );


  return match

    ? new Date(
        +match[1],
        +match[2] - 1,
        +match[3]
      )

    : null;

}



function addDays(
  date,
  number
) {

  const result =
    new Date(date);


  result.setDate(
    result.getDate()
    + number
  );


  return result;

}



/*
Used only for monthly frequency.

If an activity starts on 31 January,
February occurrence will use
February's last valid day.
*/

function addMonthsClamped(
  date,
  monthCount,
  preferredDay
) {

  const result =
    new Date(

      date.getFullYear(),

      date.getMonth()
      + monthCount,

      1

    );


  const finalDay =
    new Date(

      result.getFullYear(),

      result.getMonth() + 1,

      0

    ).getDate();


  result.setDate(

    Math.min(
      preferredDay,
      finalDay
    )

  );


  return result;

}



/* =========================================================
   ROWS TO OBJECTS
   ORIGINAL LOGIC PRESERVED.
   ========================================================= */

function rowsToObjects(rows) {

  if (
    !rows.length
  ) {

    return [];

  }


  let headerRow =
    0;


  let bestScore =
    -1;


  for (

    let index = 0;

    index <
      Math.min(
        rows.length,
        20
      );

    index++

  ) {


    const cells =
      rows[index]
      .map(norm);


    const score =
      cells.filter(

        cell =>

          /activity|event|活动|title|名称|startdate|开始日期|date|日期/.test(
            cell
          )

      ).length;


    if (
      score >
      bestScore
    ) {

      bestScore =
        score;

      headerRow =
        index;

    }

  }


  const headers =
    rows[
      headerRow
    ].map(clean);


  return rows

    .slice(
      headerRow + 1
    )

    .filter(

      row =>

        row.some(

          value =>
            clean(value) !== ""

        )

    )

    .map(

      row => {

        const object = {};


        headers.forEach(

          (
            header,
            index
          ) => {

            if (header) {

              object[
                header
              ] =
                clean(
                  row[index]
                );

            }

          }

        );


        return object;

      }

    );

}



/* =========================================================
   GET FIELD VALUE
   ========================================================= */

function getValue(
  object,
  patterns
) {


  const entry =
    Object.entries(
      object
    ).find(

      (
        [
          key,
          value
        ]
      ) =>

        patterns.some(

          pattern =>
            pattern.test(
              norm(key)
            )

        )

        &&

        clean(value) !== ""

    );


  return entry

    ? clean(
        entry[1]
      )

    : "";

}



/* =========================================================
   DETECT ACTIVITIES

   ORIGINAL LOGIC +
   FREQUENCY +
   REPEAT UNTIL
   ========================================================= */

function detectActivities(rows) {


  const objects =
    rowsToObjects(rows);


  return objects

    .map(

      (
        object,
        index
      ) => {


        const title =
          getValue(
            object,
            [

              /^(activity|event|活动名称|活动|title|name|eventname|activityname)$/,

              /activityname/,

              /eventname/,

              /活动名称/

            ]
          );


        const startRaw =
          getValue(
            object,
            [

              /^(startdate|start|date|日期|开始日期|活动日期|eventdate)$/,

              /startdate/,

              /开始日期/,

              /活动日期/,

              /^date$/

            ]
          );


        const endRaw =
          getValue(
            object,
            [

              /^(enddate|end|结束日期)$/,

              /enddate/,

              /结束日期/

            ]
          );


        const enabled =
          getValue(
            object,
            [

              /^(enabled|active|status|启用|状态|是否启用)$/,

              /enabled/,

              /active/,

              /启用/

            ]
          );


        const category =
          getValue(
            object,
            [

              /^(category|type|类别|类型|分类|活动类别)$/,

              /category/,

              /活动类别/,

              /类别/,

              /类型/

            ]
          );


        const location =
          getValue(
            object,
            [

              /^(location|venue|地点|场地)$/,

              /location/,

              /venue/,

              /地点/,

              /场地/

            ]
          );


        const owner =
          getValue(
            object,
            [

              /^(owner|personincharge|负责人|负责人单位|负责人员|联系人)$/,

              /owner/,

              /负责人/,

              /联系人/

            ]
          );


        const description =
          getValue(
            object,
            [

              /^(description|details|备注|说明|内容)$/,

              /description/,

              /details/,

              /备注/,

              /说明/

            ]
          );



        /*
        =====================================
        NEW:
        FREQUENCY / 频率
        =====================================
        */

        const recurrence =
          getValue(
            object,
            [

              /^(frequency|freq|recurrence|repeat|频率|重复|重复规则)$/,

              /frequency/,

              /recurrence/,

              /repeat/,

              /频率/,

              /重复规则/

            ]
          );



        /*
        =====================================
        NEW:
        REPEAT UNTIL / 重复至
        =====================================
        */

        const repeatUntilRaw =
          getValue(
            object,
            [

              /^(repeatuntil|repeatend|recurrenceend|until|重复至|重复结束日期)$/,

              /repeatuntil/,

              /repeatend/,

              /recurrenceend/,

              /重复至/

            ]
          );



        const start =
          parseDate(
            startRaw
          );


        const end =
          parseDate(
            endRaw
          )

          ||

          start;


        const repeatUntil =
          parseDate(
            repeatUntilRaw
          );



        if (

          !title

          ||

          !start

        ) {

          return null;

        }



        /*
        Blank enabled value remains enabled.
        */

        if (

          /^(false|no|n|0|inactive|disabled|否|停用)$/i.test(
            enabled
          )

        ) {

          return null;

        }



        return {

          id:
            "a" + index,

          title,

          start,

          end,

          category,

          location,

          owner,

          description,

          recurrence,

          repeatUntil

        };

      }

    )

    .filter(Boolean);

}



/* =========================================================
   EXPAND ACTIVITIES

   SINGLE
   DAILY
   WEEKLY
   BIWEEKLY
   MONTHLY
   YEARLY
   ========================================================= */

function expandActivities(items) {


  const expanded = [];


  const DEFAULT_REPEAT_END =
    new Date(
      2027,
      11,
      31
    );


  const ABSOLUTE_LIMIT =
    new Date(
      2028,
      11,
      31
    );



  for (
    const activity
    of items
  ) {


    const start =
      new Date(
        activity.start
      );


    const end =
      new Date(

        activity.end

        ||

        activity.start

      );


    const rule =
      clean(
        activity.recurrence
      )
      .toLowerCase();



    /*
    ==========================================
    SINGLE ACTIVITY
    ==========================================

    Uses:
    Start Date
    End Date

    Does NOT use Repeat Until.
    */

    const isSingle =

      !rule

      ||

      /^(none|no|never|无|不重复|一次|单次|one.?time)$/i.test(
        rule
      );



    if (
      isSingle
    ) {


      for (

        let date =
          new Date(start),
          count = 0;


        date <= end

        &&

        count < 370;


        date =
          addDays(
            date,
            1
          ),

        count++

      ) {


        expanded.push({

          ...activity,

          date:
            dateKey(date)

        });

      }


      continue;

    }



    /*
    ==========================================
    RECURRING ACTIVITY
    ==========================================

    Uses:
    Start Date
    Frequency
    Repeat Until
    */


    const requestedStop =

      activity.repeatUntil

      ||

      DEFAULT_REPEAT_END;



    const stop =

      new Date(

        Math.min(

          requestedStop.getTime(),

          ABSOLUTE_LIMIT.getTime()

        )

      );



    /*
    Invalid Repeat Until:
    show starting date once.
    */

    if (
      stop < start
    ) {


      expanded.push({

        ...activity,

        date:
          dateKey(start)

      });


      continue;

    }



    let mode =
      "";



    /*
    DAILY
    */

    if (

      /daily|everyday|每天|每日|日重复/.test(
        rule
      )

    ) {

      mode =
        "daily";

    }



    /*
    BIWEEKLY must be checked
    before WEEKLY.
    */

    else if (

      /biweekly|fortnightly|every2weeks|每两周|每2周|双周/.test(
        rule
      )

    ) {

      mode =
        "biweekly";

    }



    /*
    WEEKLY
    */

    else if (

      /weekly|everyweek|每周|每星期|星期|周重复/.test(
        rule
      )

    ) {

      mode =
        "weekly";

    }



    /*
    MONTHLY
    */

    else if (

      /monthly|everymonth|每月|月重复/.test(
        rule
      )

    ) {

      mode =
        "monthly";

    }



    /*
    YEARLY
    */

    else if (

      /yearly|annually|everyyear|每年|年度/.test(
        rule
      )

    ) {

      mode =
        "yearly";

    }



    /*
    Unknown frequency:
    preserve original behaviour.
    */

    if (
      !mode
    ) {


      expanded.push({

        ...activity,

        date:
          dateKey(start)

      });


      continue;

    }



    /*
    ==========================================
    DAILY
    ==========================================
    */

    if (
      mode === "daily"
    ) {


      for (

        let date =
          new Date(start),
          count = 0;


        date <= stop

        &&

        count < 800;


        date =
          addDays(
            date,
            1
          ),

        count++

      ) {


        expanded.push({

          ...activity,

          date:
            dateKey(date)

        });

      }


      continue;

    }



    /*
    ==========================================
    WEEKLY
    ==========================================
    */

    if (
      mode === "weekly"
    ) {


      for (

        let date =
          new Date(start),
          count = 0;


        date <= stop

        &&

        count < 200;


        date =
          addDays(
            date,
            7
          ),

        count++

      ) {


        expanded.push({

          ...activity,

          date:
            dateKey(date)

        });

      }


      continue;

    }



    /*
    ==========================================
    EVERY TWO WEEKS
    ==========================================
    */

    if (
      mode === "biweekly"
    ) {


      for (

        let date =
          new Date(start),
          count = 0;


        date <= stop

        &&

        count < 100;


        date =
          addDays(
            date,
            14
          ),

        count++

      ) {


        expanded.push({

          ...activity,

          date:
            dateKey(date)

        });

      }


      continue;

    }



    /*
    ==========================================
    MONTHLY
    ==========================================
    */

    if (
      mode === "monthly"
    ) {


      const preferredDay =
        start.getDate();


      for (

        let monthNumber = 0;

        monthNumber < 100;

        monthNumber++

      ) {


        const date =

          addMonthsClamped(

            start,

            monthNumber,

            preferredDay

          );


        if (
          date > stop
        ) {

          break;

        }


        expanded.push({

          ...activity,

          date:
            dateKey(date)

        });

      }


      continue;

    }



    /*
    ==========================================
    YEARLY
    ==========================================
    */

    if (
      mode === "yearly"
    ) {


      for (

        let year =
          start.getFullYear(),
          count = 0;


        count < 10;


        year++,
        count++

      ) {


        const finalDay =
          new Date(

            year,

            start.getMonth() + 1,

            0

          ).getDate();


        const date =
          new Date(

            year,

            start.getMonth(),

            Math.min(

              start.getDate(),

              finalDay

            )

          );


        if (
          date > stop
        ) {

          break;

        }


        expanded.push({

          ...activity,

          date:
            dateKey(date)

        });

      }

    }

  }


  return expanded;

}



/* =========================================================
   DATE INFORMATION
   ORIGINAL LOGIC PRESERVED
   ========================================================= */

function parseDateInfo(rows) {


  return rowsToObjects(rows)

    .map(

      object => {


        const raw =
          getValue(
            object,
            [

              /^(date|日期|公历日期|gregoriandate)$/,

              /date/,

              /日期/

            ]
          );


        const date =
          parseDate(raw);


        if (
          !date
        ) {

          return null;

        }


        return {

          date:
            dateKey(date),


          lunar:
            getValue(
              object,
              [

                /^(lunar|lunarcalendar|农历|农历日期|农历标记)$/,

                /lunar/,

                /农历/

              ]
            ),


          holiday:
            getValue(
              object,
              [

                /^(holiday|publicholiday|节日|公共假期|假期)$/,

                /holiday/,

                /公共假期/,

                /节日/,

                /假期/

              ]
            ),


          note:
            getValue(
              object,
              [

                /^(note|备注|说明)$/,

                /note/,

                /备注/

              ]
            )

        };

      }

    )

    .filter(Boolean);

}



/* =========================================================
   FETCH CSV
   ORIGINAL LOGIC PRESERVED
   ========================================================= */

async function fetchCSV(url) {


  if (
    !url

    ||

    url.includes(
      "YOUR_"
    )
  ) {

    throw new Error(
      "尚未填写 Google Sheets CSV URL。"
    );

  }


  const response =
    await fetch(

      url,

      {
        cache:
          "no-store"
      }

    );


  if (
    !response.ok
  ) {

    throw new Error(

      `HTTP ${response.status} ${response.statusText}`

    );

  }


  const text =
    await response.text();


  const trimmed =
    text.trim();


  if (
    !trimmed
  ) {

    throw new Error(
      "CSV 内容为空。"
    );

  }


  if (

    /^<!doctype html/i.test(
      trimmed
    )

    ||

    /^<html/i.test(
      trimmed
    )

  ) {

    throw new Error(

      "Google Sheets 返回 HTML，而不是 CSV。请检查发布设置。"

    );

  }


  return parseCSV(text);

}



/* =========================================================
   LOAD DATA
   ========================================================= */

async function loadData() {


  $("refreshBtn").disabled =
    true;


  $("loadStatus").textContent =
    "正在载入…";


  $("errorBox").style.display =
    "none";


  try {


    const activityRows =
      await fetchCSV(
        ACTIVITY_CSV_URL
      );


    const parsed =
      detectActivities(
        activityRows
      );


    if (
      !parsed.length
    ) {


      console.error(

        "活动 CSV 前20行：",

        activityRows.slice(
          0,
          20
        )

      );


      throw new Error(

        "已连接 CSV，但无法识别活动日期或活动名称。请检查 Google Sheets 的实际表头。"

      );

    }



    activities =
      expandActivities(
        parsed
      );



    /*
    Date information is optional.
    */


    try {


      dateInfo =
        parseDateInfo(

          await fetchCSV(
            DATE_INFO_CSV_URL
          )

        );


    }


    catch (
      dateError
    ) {


             dateError

      );


      dateInfo =
        [];

    }



    $("loadStatus").textContent =

      `成功载入 ${parsed.length} 项活动`;


    render();


  }


  catch (
    error
  ) {


    console.error(

      "Calendar loading error:",

      error

    );


    $("loadStatus").textContent =
      "载入失败";


    $("errorBox").textContent =

      "活动资料载入失败：\n"

      +

      error.message;


    $("errorBox").style.display =
      "block";


    $("eventList").innerHTML =

      '<div class="empty">暂时无法显示活动。请检查资料连接后再刷新。</div>';


  }


  finally {


    $("refreshBtn").disabled =
      false;

  }

}



/* =========================================================
   FILTERING
   ========================================================= */

function infoFor(key) {


  return dateInfo.find(

    item =>
      item.date === key

  );

}



function matchesSearch(
  activity
) {


  return (

    !searchTerm

    ||

    [

      activity.title,

      activity.category,

      activity.location,

      activity.owner,

      activity.description

    ]

    .join(" ")

    .toLowerCase()

    .includes(
      searchTerm
    )

  );

}



function activityOn(key) {


  return activities.filter(

    activity =>

      activity.date === key

      &&

      matchesSearch(
        activity
      )

  );

}



/* =========================================================
   CALENDAR
   ========================================================= */

function renderCalendar() {


  const year =
    viewDate.getFullYear();


  const month =
    viewDate.getMonth();


  $("monthLabel").textContent =

    `${year} 年 ${month + 1} 月`;



  const first =
    new Date(
      year,
      month,
      1
    );


  const start =
    addDays(

      first,

      -first.getDay()

    );


  const todayKey =
    dateKey(
      new Date()
    );


  let html =
    "";



  for (

    let index = 0;

    index < 42;

    index++

  ) {


    const date =
      addDays(
        start,
        index
      );


    const key =
      dateKey(date);


    const inMonth =
      date.getMonth()
      ===
      month;


    const events =
      activityOn(key);


    const info =
      infoFor(key);



    const classes =

      "day"

      +

      (
        !inMonth
          ? " outside"
          : ""
      )

      +

      (
        key === todayKey
          ? " today"
          : ""
      )

      +

      (
        key === selectedDate
          ? " selected"
          : ""
      );



    html += `

      <div

        class="${classes}"

        data-date="${key}"

        tabindex="0"

        role="button"

        aria-label="${key}"

      >


        <div class="daynum">

          ${date.getDate()}


          ${

            info

            &&

            info.holiday

              ? '<span class="pill">假期</span>'

              : ""

          }

        </div>


        ${

          info

          &&

          info.lunar

            ? `

              <div

                style="
                  font-size:10px;
                  color:#8a929b;
                  margin-bottom:3px;
                "

              >

                ${escapeHTML(
                  info.lunar
                )}

              </div>

            `

            : ""

        }


        ${

          events

            .slice(
              0,
              3
            )

            .map(

              event => `

                <span

                  class="event-chip"

                  title="${escapeHTML(
                    event.title
                  )}"

                >

                  ${escapeHTML(
                    event.title
                  )}

                </span>

              `

            )

            .join("")

        }


        ${

          events.length > 3

            ? `

              <span
                class="event-chip more"
              >

                另有
                ${events.length - 3}
                项

              </span>

            `

            : ""

        }


        ${

          info

          &&

          info.holiday

            ? `

              <div

                style="
                  font-size:10px;
                  color:#9a6a2d;
                  margin-top:3px;
                  line-height:1.35;
                "

              >

                ${escapeHTML(
                  info.holiday
                )}

              </div>

            `

            : ""

        }


      </div>

    `;

  }



  $("days").innerHTML =
    html;



  $("days")

    .querySelectorAll(
      ".day"
    )

    .forEach(

      element => {


        const choose =
          () => {


            selectedDate =
              element.dataset.date;


            render();

          };


        element.addEventListener(

          "click",

          choose

        );


        element.addEventListener(

          "keydown",

          event => {


            if (

              event.key === "Enter"

              ||

              event.key === " "

            ) {


              event.preventDefault();


              choose();

            }

          }

        );

      }

    );

}

  ) {


    list =
      all.filter(

        activity =>
          activity.date
          ===
          selectedDate

      );


    title =
      `${selectedDate} 的活动`;

  }


  else {


    list =
      all.filter(

        activity => {


          const date =
            fromKey(
              activity.date
            );


          return (

            date

            &&

            date.getFullYear()
              ===
            viewDate.getFullYear()

            &&

            date.getMonth()
              ===
            viewDate.getMonth()

          );

        }

      );


    title =

      searchTerm

        ? "搜索结果"

        : `${viewDate.getFullYear()} 年 ${viewDate.getMonth() + 1} 月活动`;

  }



  list.sort(

    (
      first,
      second
    ) =>

      first.date.localeCompare(
        second.date
      )

      ||

      first.title.localeCompare(
        second.title
      )

  );



  $("listTitle").textContent =
    title;


  $("resultCount").textContent =
    `${list.length} 项`;



  if (
    !list.length
  ) {


    $("eventList").innerHTML = `

      <div class="empty">

        ${

          searchTerm

            ? "没有找到符合条件的活动。"

            : "这一天 / 这个月份暂时没有活动。"

        }

      </div>

    `;


    return;

  }



  $("eventList").innerHTML =

    list

      .slice(
        0,
        150
      )

      .map(
        eventCard
      )

      .join("")

    +

    (

      list.length > 150

        ? `

          <div class="empty">

            仅显示前 150 项，
            请缩小搜索范围。

          </div>

        `

        : ""

    );

}



/* =========================================================
   RENDER
   ========================================================= */

function render() {

  renderCalendar();

  renderList();

}



/* =========================================================
   BUTTONS
   ========================================================= */

$("prevBtn")

  .addEventListener(

    "click",

    () => {


      viewDate =
        new Date(

          viewDate.getFullYear(),

          viewDate.getMonth() - 1,

          1

        );


      selectedDate =
        "";


      render();

    }

  );



$("nextBtn")

  .addEventListener(

    "click",

    () => {


      viewDate =
        new Date(

          viewDate.getFullYear(),

          viewDate.getMonth() + 1,

          1

        );


      selectedDate =
        "";


      render();

    }

  );



$("todayBtn")

  .addEventListener(

    "click",

    () => {


      const now =
        new Date();


      viewDate =
        new Date(

          now.getFullYear(),

          now.getMonth(),

          1

        );


      selectedDate =
        dateKey(now);


      render();

    }

  );



$("refreshBtn")

  .addEventListener(

    "click",

    loadData

  );



$("searchInput")

  .addEventListener(

    "input",

    event => {


      searchTerm =

        event.target.value

          .trim()

          .toLowerCase();


      render();

    }

  );



/* =========================================================
   START
   ========================================================= */

render();

loadData();


setInterval(

  loadData,

  5 * 60 * 1000

);

</script>


</body>
</html>
