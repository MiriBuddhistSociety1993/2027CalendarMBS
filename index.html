<script>

"use strict";


/* =========================================================
   GOOGLE SHEETS CSV

   IMPORTANT:
   把你原本的两个 CSV URL 填回这里
   ========================================================= */

const ACTIVITY_CSV_URL =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vTcmNKJ322HzGxtlRqsQNQ-1DLRq-LXcivKuWEt7DWfXnf_EpofCpUkzbL9FUvK_WSxH0RaHbsCs5mY/pub?gid=1830432104&single=true&output=csv";

const DATE_INFO_CSV_URL =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vTcmNKJ322HzGxtlRqsQNQ-1DLRq-LXcivKuWEt7DWfXnf_EpofCpUkzbL9FUvK_WSxH0RaHbsCs5mY/pub?gid=688612611&single=true&output=csv";


/* =========================================================
   CALENDAR SETTINGS
   ========================================================= */

const CALENDAR_END =
  new Date(2027, 11, 31);


let activities = [];

let dateInfo = [];

let viewDate =
  new Date(2027, 0, 1);

let selectedDate = "";

let searchTerm = "";


const $ = id =>
  document.getElementById(id);


const clean = value =>
  String(value ?? "")
    .replace(/^\uFEFF/, "")
    .trim();


const norm = value =>
  clean(value)
    .toLowerCase()
    .replace(
      /[\s_\-()（）:：/？?]+/g,
      ""
    );


/* =========================================================
   HTML ESCAPE
   ========================================================= */

function escapeHTML(value) {

  return String(value ?? "")
    .replace(
      /[&<>"']/g,
      character => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      })[character]
    );

}


/* =========================================================
   CSV PARSER
   ========================================================= */

function parseCSV(text) {

  const rows = [];

  let row = [];

  let field = "";

  let quoted = false;


  text =
    String(text ?? "")
      .replace(/^\uFEFF/, "");


  for (
    let i = 0;
    i < text.length;
    i++
  ) {

    const character =
      text[i];


    if (quoted) {

      if (
        character === '"' &&
        text[i + 1] === '"'
      ) {

        field += '"';

        i++;

      }

      else if (
        character === '"'
      ) {

        quoted = false;

      }

      else {

        field += character;

      }

    }

    else {

      if (
        character === '"' &&
        field === ""
      ) {

        quoted = true;

      }

      else if (
        character === ","
      ) {

        row.push(field);

        field = "";

      }

      else if (
        character === "\n" ||
        character === "\r"
      ) {

        if (
          character === "\r" &&
          text[i + 1] === "\n"
        ) {

          i++;

        }


        row.push(field);


        if (
          row.some(
            value =>
              clean(value) !== ""
          )
        ) {

          rows.push(row);

        }


        row = [];

        field = "";

      }

      else {

        field += character;

      }

    }

  }


  row.push(field);


  if (
    row.some(
      value =>
        clean(value) !== ""
    )
  ) {

    rows.push(row);

  }


  return rows;

}


/* =========================================================
   DATE FUNCTIONS
   ========================================================= */

function validDate(
  year,
  month,
  day
) {

  const date =
    new Date(
      year,
      month - 1,
      day
    );


  return (
    date.getFullYear() === year &&
    date.getMonth() === month - 1 &&
    date.getDate() === day
  )
    ? date
    : null;

}


/* =========================================================
   PARSE DATE
   ========================================================= */

function parseDate(value) {

  const text =
    clean(value);


  if (!text) {

    return null;

  }


  let match;


  /* yyyy-mm-dd */

  match =
    text.match(
      /^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})(?:$|T|\s)/
    );


  if (match) {

    return validDate(
      Number(match[1]),
      Number(match[2]),
      Number(match[3])
    );

  }


  /* Malaysian dd/mm/yyyy */

  match =
    text.match(
      /^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{4})$/
    );


  if (match) {

    return validDate(
      Number(match[3]),
      Number(match[2]),
      Number(match[1])
    );

  }


  /* English month names */

  const months = {

    jan: 0,
    january: 0,

    feb: 1,
    february: 1,

    mar: 2,
    march: 2,

    apr: 3,
    april: 3,

    may: 4,

    jun: 5,
    june: 5,

    jul: 6,
    july: 6,

    aug: 7,
    august: 7,

    sep: 8,
    sept: 8,
    september: 8,

    oct: 9,
    october: 9,

    nov: 10,
    november: 10,

    dec: 11,
    december: 11

  };


  /* 13-Feb-27 */

  match =
    text.match(
      /^(\d{1,2})[\s\-\/]([A-Za-z]{3,9})[\s,\-\/]+(\d{2,4})$/
    );


  if (
    match &&
    months[
      match[2].toLowerCase()
    ] !== undefined
  ) {

    let year =
      Number(match[3]);


    if (
      year < 100
    ) {

      year +=
        year < 50
          ? 2000
          : 1900;

    }


    return validDate(

      year,

      months[
        match[2].toLowerCase()
      ] + 1,

      Number(match[1])

    );

  }


  /* Feb 13, 2027 */

  match =
    text.match(
      /^([A-Za-z]{3,9})\s+(\d{1,2}),?\s+(\d{4})$/
    );


  if (
    match &&
    months[
      match[1].toLowerCase()
    ] !== undefined
  ) {

    return validDate(

      Number(match[3]),

      months[
        match[1].toLowerCase()
      ] + 1,

      Number(match[2])

    );

  }


  /* Excel / Google Sheets serial */

  if (
    /^\d{5}(?:\.0+)?$/
      .test(text)
  ) {

    const date =
      new Date(
        Date.UTC(
          1899,
          11,
          30
        ) +
        Math.floor(
          Number(text)
        ) *
        86400000
      );


    return validDate(

      date.getUTCFullYear(),

      date.getUTCMonth() + 1,

      date.getUTCDate()

    );

  }


  const parsed =
    new Date(text);


  if (
    !Number.isNaN(
      parsed.getTime()
    )
  ) {

    return validDate(

      parsed.getFullYear(),

      parsed.getMonth() + 1,

      parsed.getDate()

    );

  }


  return null;

}


/* =========================================================
   DATE KEY
   ========================================================= */

function dateKey(date) {

  return (

    `${date.getFullYear()}-` +

    `${String(
      date.getMonth() + 1
    ).padStart(2, "0")}-` +

    `${String(
      date.getDate()
    ).padStart(2, "0")}`

  );

}


function fromKey(key) {

  const match =
    String(key).match(
      /^(\d{4})-(\d{2})-(\d{2})$/
    );


  if (!match) {

    return null;

  }


  return new Date(

    Number(match[1]),

    Number(match[2]) - 1,

    Number(match[3])

  );

}


function addDays(
  date,
  number
) {

  const result =
    new Date(date);


  result.setDate(
    result.getDate() +
    number
  );


  return result;

}


/* =========================================================
   TIME PARSER

   Support:
   08:30
   08:30:00
   8.30 am
   7.30 pm
   Excel decimal time
   ========================================================= */

function parseTimeParts(value) {

  const text =
    clean(value);


  if (!text) {

    return null;

  }


  /* Excel decimal time */

  if (
    /^(?:0?\.\d+|1(?:\.0+)?)$/
      .test(text)
  ) {

    const serial =
      Number(text);


    if (
      Number.isFinite(serial) &&
      serial >= 0 &&
      serial <= 1
    ) {

      let totalMinutes =
        Math.round(
          serial *
          24 *
          60
        );


      if (
        totalMinutes >= 1440
      ) {

        totalMinutes = 0;

      }


      return {

        hour:
          Math.floor(
            totalMinutes / 60
          ),

        minute:
          totalMinutes % 60

      };

    }

  }


  /* Normal time */

  const match =
    text.match(
      /^(\d{1,2})[:.](\d{2})(?::\d{2})?\s*(am|pm)?$/i
    );


  if (!match) {

    return null;

  }


  let hour =
    Number(match[1]);

  const minute =
    Number(match[2]);

  const period =
    clean(match[3])
      .toLowerCase();


  if (
    hour > 23 ||
    minute > 59
  ) {

    return null;

  }


  if (period) {

    if (
      hour < 1 ||
      hour > 12
    ) {

      return null;

    }


    if (
      period === "am" &&
      hour === 12
    ) {

      hour = 0;

    }


    if (
      period === "pm" &&
      hour !== 12
    ) {

      hour += 12;

    }

  }


  return {

    hour,

    minute

  };

}


/* =========================================================
   FORMAT TIME
   ========================================================= */

function formatTime(value) {

  const parts =
    parseTimeParts(value);


  if (!parts) {

    return clean(value);

  }


  const period =
    parts.hour >= 12
      ? "PM"
      : "AM";


  const displayHour =
    parts.hour % 12 || 12;


  return (

    `${displayHour}:` +

    `${String(
      parts.minute
    ).padStart(2, "0")} ` +

    `${period}`

  );

}


/* =========================================================
   ACTIVITY TIME
   ========================================================= */

function activityTime(activity) {

  const startTime =
    formatTime(
      activity.startTime
    );


  const endTime =
    formatTime(
      activity.endTime
    );


  if (
    startTime &&
    endTime
  ) {

    return (
      `${startTime} – ${endTime}`
    );

  }


  if (startTime) {

    return startTime;

  }


  if (endTime) {

    return (
      `至 ${endTime}`
    );

  }


  return "";

}


/* =========================================================
   TIME SORT
   ========================================================= */

function timeSortNumber(value) {

  const parts =
    parseTimeParts(value);


  if (!parts) {

    return (
      Number.MAX_SAFE_INTEGER
    );

  }


  return (

    parts.hour * 60 +

    parts.minute

  );

}


/* =========================================================
   DETECT HEADER
   ========================================================= */

function rowsToObjects(rows) {

  if (!rows.length) {

    return [];

  }


  let headerRow = 0;

  let bestScore = -1;


  for (
    let i = 0;
    i < Math.min(
      rows.length,
      20
    );
    i++
  ) {

    const cells =
      rows[i].map(norm);


    const score =
      cells.filter(
        cell =>
          /activity|event|活动|title|名称|startdate|开始日期|date|日期|开始时间|频率|重复至/
            .test(cell)
      ).length;


    if (
      score > bestScore
    ) {

      bestScore = score;

      headerRow = i;

    }

  }


  const headers =
    rows[headerRow]
      .map(clean);


  return rows

    .slice(
      headerRow + 1
    )

    .filter(
      row =>
        row.some(
          value =>
            clean(value) !== ""
        )
    )

    .map(
      row => {

        const object = {};


        headers.forEach(
          (
            header,
            index
          ) => {

            if (header) {

              object[header] =
                clean(
                  row[index]
                );

            }

          }
        );


        return object;

      }
    );

}


/* =========================================================
   GET COLUMN VALUE
   ========================================================= */

function getValue(
  object,
  patterns
) {

  const entry =
    Object.entries(
      object
    ).find(
      ([key, value]) =>

        patterns.some(
          pattern =>
            pattern.test(
              norm(key)
            )
        ) &&

        clean(value) !== ""

    );


  return entry
    ? clean(entry[1])
    : "";

}


/* =========================================================
   DETECT ACTIVITIES
   ========================================================= */

function detectActivities(rows) {

  const objects =
    rowsToObjects(rows);


  return objects

    .map(
      (
        object,
        index
      ) => {


        /* Activity name */

        const title =
          getValue(
            object,
            [

              /^(activity|event|活动名称|活动|title|name|eventname|activityname)$/,

              /activityname/,

              /eventname/,

              /活动名称/

            ]
          );


        /* Start date */

        const startRaw =
          getValue(
            object,
            [

              /^(startdate|start|date|日期|开始日期|活动日期|eventdate)$/,

              /startdate/,

              /开始日期/,

              /活动日期/,

              /^date$/

            ]
          );


        /* End date */

        const endRaw =
          getValue(
            object,
            [

              /^(enddate|end|结束日期)$/,

              /enddate/,

              /结束日期/

            ]
          );


        /* Start time */

        const startTime =
          getValue(
            object,
            [

              /^(starttime|开始时间|活动开始时间)$/,

              /starttime/,

              /开始时间/

            ]
          );


        /* End time */

        const endTime =
          getValue(
            object,
            [

              /^(endtime|结束时间|活动结束时间)$/,

              /endtime/,

              /结束时间/

            ]
          );


        /* Internal enabled */

        const internalEnabled =
          getValue(
            object,
            [

              /^(enabled|active|status|启用|状态|是否启用|内部启用)$/,

              /内部启用/,

              /enabled/,

              /active/

            ]
          );


        /*
        Public enabled column
        */

        const publicHeaderExists =
          Object.keys(
            object
          ).some(
            key =>
              norm(key) ===
              norm("大众启用?")
          );


        const publicEnabled =
          getValue(
            object,
            [

              /^大众启用$/,

              /大众启用/

            ]
          );


        /* Category */

        const category =
          getValue(
            object,
            [

              /^(category|type|类别|类型|分类)$/,

              /category/,

              /类别/,

              /类型/

            ]
          );


        /* Location */

        const location =
          getValue(
            object,
            [

              /^(location|venue|地点|场地)$/,

              /location/,

              /venue/,

              /地点/,

              /场地/

            ]
          );


        /* Owner */

        const owner =
          getValue(
            object,
            [

              /^(owner|personincharge|负责人|负责人员|联系人)$/,

              /owner/,

              /负责人/,

              /联系人/

            ]
          );


        /* Description */

        const description =
          getValue(
            object,
            [

              /^(description|details|备注|说明|内容)$/,

              /description/,

              /details/,

              /备注/,

              /说明/

            ]
          );


        /* Frequency */

        const recurrence =
          getValue(
            object,
            [

              /^(recurrence|repeat|重复|重复规则|频率)$/,

              /recurrence/,

              /repeat/,

              /重复/,

              /频率/

            ]
          );


        /* Repeat until */

        const repeatUntilRaw =
          getValue(
            object,
            [

              /^(repeatuntil|重复至|重复截止日期|截止日期)$/,

              /repeatuntil/,

              /重复至/

            ]
          );


        const start =
          parseDate(
            startRaw
          );


        const end =
          parseDate(
            endRaw
          ) || start;


        const repeatUntil =
          parseDate(
            repeatUntilRaw
          );


        /* Must have title and start date */

        if (
          !title ||
          !start
        ) {

          return null;

        }


        /* Check internal enable */

        if (
          /^(false|no|n|0|inactive|disabled|否|停用)$/i
            .test(
              internalEnabled
            )
        ) {

          return null;

        }


        /* Check public enable */

        if (
          publicHeaderExists &&
          !/^是$/i.test(
            clean(
              publicEnabled
            )
          )
        ) {

          return null;

        }


        return {

          id:
            "a" + index,

          title,

          start,

          end,

          startTime,

          endTime,

          repeatUntil,

          category,

          location,

          owner,

          description,

          recurrence

        };

      }
    )

    .filter(Boolean);

}


/* =========================================================
   RECURRENCE MODE

   Supported:
   单次
   每日
   每周
   每两周
   每月
   每年
   ========================================================= */

function recurrenceMode(value) {

  const rule =
    clean(
      value || "单次"
    ).toLowerCase();


  /* Single */

  if (

    !rule ||

    /^(none|no|never|无|不重复|一次|one.?time|单次)$/i
      .test(rule)

  ) {

    return "single";

  }


  /* Daily */

  if (
    /^(daily|每日|每天|日重复)$/
      .test(rule)
  ) {

    return "daily";

  }


  /* Weekly */

  if (
    /^(weekly|每周|星期|周重复)$/
      .test(rule)
  ) {

    return "weekly";

  }


  /* Biweekly */

  if (
    /^(biweekly|fortnightly|每两周|每隔两周)$/
      .test(rule)
  ) {

    return "biweekly";

  }


  /* Monthly */

  if (
    /^(monthly|每月|月重复)$/
      .test(rule)
  ) {

    return "monthly";

  }


  /* Yearly */

  if (
    /^(yearly|annually|每年|每年度)$/
      .test(rule)
  ) {

    return "yearly";

  }


  return "";

}


/* =========================================================
   RECURRENCE LABEL
   ========================================================= */

function recurrenceLabel(value) {

  const mode =
    recurrenceMode(value);


  const labels = {

    single:
      "单次",

    daily:
      "每日",

    weekly:
      "每周",

    biweekly:
      "每两周",

    monthly:
      "每月",

    yearly:
      "每年"

  };


  return (
    labels[mode] ||
    clean(value)
  );

}


/* =========================================================
   EFFECTIVE REPEAT UNTIL

   If repeat-until is blank:
   defaults to 31 Dec 2027
   ========================================================= */

function effectiveRepeatUntil(
  activity
) {

  const requestedEnd =

    activity.repeatUntil ||

    CALENDAR_END;


  return new Date(

    Math.min(

      requestedEnd.getTime(),

      CALENDAR_END.getTime()

    )

  );

}


/* =========================================================
   CHECK RECURRENCE
   ========================================================= */

function recurrenceMatches(
  activity,
  date,
  mode
) {

  const start =
    activity.start;


  const daysFromStart =
    Math.round(

      (

        Date.UTC(

          date.getFullYear(),

          date.getMonth(),

          date.getDate()

        )

        -

        Date.UTC(

          start.getFullYear(),

          start.getMonth(),

          start.getDate()

        )

      )

      /

      86400000

    );


  if (
    mode === "daily"
  ) {

    return true;

  }


  if (
    mode === "weekly"
  ) {

    return (
      daysFromStart % 7 === 0
    );

  }


  if (
    mode === "biweekly"
  ) {

    return (
      daysFromStart % 14 === 0
    );

  }


  if (
    mode === "monthly"
  ) {

    return (
      date.getDate() ===
      start.getDate()
    );

  }


  if (
    mode === "yearly"
  ) {

    return (

      date.getMonth() ===
      start.getMonth()

      &&

      date.getDate() ===
      start.getDate()

    );

  }


  return false;

}


/* =========================================================
   EXPAND ACTIVITIES
   ========================================================= */

function expandActivities(
  items
) {

  const expanded = [];


  for (
    const activity of items
  ) {

    const mode =
      recurrenceMode(
        activity.recurrence
      );


    /* Unknown frequency */

    if (!mode) {

      console.warn(
        "未识别的活动频率：",
        activity.title,
        activity.recurrence
      );


      continue;

    }


    /* =====================================================
       SINGLE / MULTI-DAY
       ===================================================== */

    if (
      mode === "single"
    ) {

      const stopDate =

        activity.end &&
        activity.end >= activity.start

        ? activity.end

        : activity.start;


      for (

        let date =
          new Date(
            activity.start
          ),

        count = 0;

        date <= stopDate &&
        count < 370;

        date =
          addDays(
            date,
            1
          ),

        count++

      ) {

        expanded.push({

          ...activity,

          date:
            dateKey(date),

          recurrenceMode:
            mode,

          effectiveRepeatUntil:
            null

        });

      }


      continue;

    }


    /* =====================================================
       RECURRING
       ===================================================== */

    const stopDate =
      effectiveRepeatUntil(
        activity
      );


    for (

      let date =
        new Date(
          activity.start
        ),

      count = 0;

      date <= stopDate &&
      count < 500;

      date =
        addDays(
          date,
          1
        ),

      count++

    ) {

      if (
        recurrenceMatches(
          activity,
          date,
          mode
        )
      ) {

        expanded.push({

          ...activity,

          date:
            dateKey(date),

          recurrenceMode:
            mode,

          effectiveRepeatUntil:
            new Date(
              stopDate
            )

        });

      }

    }

  }


  return expanded;

}


/* =========================================================
   DATE INFO
   ========================================================= */

function parseDateInfo(rows) {

  return rowsToObjects(rows)

    .map(
      object => {

        const raw =
          getValue(
            object,
            [

              /^(date|日期|公历日期|gregoriandate)$/,

              /date/,

              /日期/

            ]
          );


        const date =
          parseDate(raw);


        if (!date) {

          return null;

        }


        return {

          date:
            dateKey(date),


          lunar:
            getValue(
              object,
              [

                /^(lunar|lunarcalendar|农历|农历日期)$/,

                /lunar/,

                /农历/

              ]
            ),


          holiday:
            getValue(
              object,
              [

                /^(holiday|publicholiday|节日|公共假期|假期)$/,

                /holiday/,

                /节日/,

                /假期/

              ]
            ),


          note:
            getValue(
              object,
              [

                /^(note|备注|说明)$/,

                /note/,

                /备注/

              ]
            )

        };

      }
    )

    .filter(Boolean);

}


/* =========================================================
   FETCH CSV
   ========================================================= */

async function fetchCSV(url) {

  if (
    !clean(url)
  ) {

    throw new Error(
      "CSV URL 尚未填写。"
    );

  }


  const response =
    await fetch(
      url,
      {
        cache:
          "no-store"
      }
    );


  if (
    !response.ok
  ) {

    throw new Error(

      `HTTP ${response.status} ${response.statusText}`

    );

  }


  const text =
    await response.text();


  const trimmed =
    text.trim();


  if (!trimmed) {

    throw new Error(
      "CSV 内容为空。"
    );

  }


  if (

    /^<!doctype html/i
      .test(trimmed)

    ||

    /^<html/i
      .test(trimmed)

  ) {

    throw new Error(

      "Google Sheets 返回 HTML，而不是 CSV。请检查发布设置。"

    );

  }


  return parseCSV(text);

}


/* =========================================================
   LOAD DATA
   ========================================================= */

async function loadData() {

  $("refreshBtn").disabled =
    true;


  $("loadStatus").textContent =
    "正在载入…";


  $("errorBox").style.display =
    "none";


  try {

    const activityRows =
      await fetchCSV(
        ACTIVITY_CSV_URL
      );


    const parsed =
      detectActivities(
        activityRows
      );


    if (
      !parsed.length
    ) {

      console.error(

        "活动 CSV 前20行：",

        activityRows.slice(
          0,
          20
        )

      );


      throw new Error(

        "已连接 CSV，但无法识别活动日期或活动名称。请检查 Google Sheets 的实际表头。"

      );

    }


    /* Expand recurrence */

    activities =
      expandActivities(
        parsed
      );


    /* Date info optional */

    try {

      if (
        clean(
          DATE_INFO_CSV_URL
        )
      ) {

        const dateRows =
          await fetchCSV(
            DATE_INFO_CSV_URL
          );


        dateInfo =
          parseDateInfo(
            dateRows
          );

      }

      else {

        dateInfo = [];

      }

    }

    catch (
      dateError
    ) {

      console.warn(

        "日期附加资料无法载入：",

        dateError

      );


      dateInfo = [];

    }


    $("loadStatus").textContent =

      `成功载入 ${parsed.length} 项活动`;


    render();

  }

  catch (error) {

    console.error(

      "Calendar loading error:",

      error

    );


    $("loadStatus").textContent =
      "载入失败";


    $("errorBox").textContent =

      "活动资料载入失败：\n" +

      error.message +

      "\n\n如果出现 Failed to fetch，" +

      "可能是网络或跨站请求问题。" +

      "\n如果提示无法识别活动，" +

      "请检查 Google Sheets 的实际表头。";


    $("errorBox").style.display =
      "block";


    $("eventList").innerHTML =

      '<div class="empty">' +

      '暂时无法显示活动。请检查资料连接后再刷新。' +

      '</div>';

  }

  finally {

    $("refreshBtn").disabled =
      false;

  }

}


/* =========================================================
   DATE INFO LOOKUP
   ========================================================= */

function infoFor(key) {

  return dateInfo.find(

    item =>
      item.date === key

  );

}


/* =========================================================
   SEARCH
   ========================================================= */

function matchesSearch(
  activity
) {

  if (
    !searchTerm
  ) {

    return true;

  }


  return (

    [

      activity.title,

      activity.category,

      activity.location,

      activity.owner,

      activity.description,

      activity.startTime,

      activity.endTime,

      recurrenceLabel(
        activity.recurrence
      )

    ]

    .join(" ")

    .toLowerCase()

    .includes(
      searchTerm
    )

  );

}


/* =========================================================
   EVENT PRIORITY
   ========================================================= */

function eventPriority(
  activity
) {

  const title =
    clean(
      activity.title
    );


  if (
    title.includes(
      "开斋节"
    )
  ) {

    return 1;

  }


  if (
    title.includes(
      "学校假期"
    )
  ) {

    return 2;

  }


  if (
    title.includes(
      "青年团"
    )
  ) {

    return 3;

  }


  return 4;

}


/* =========================================================
   SORT ACTIVITIES
   ========================================================= */

function compareActivities(
  first,
  second
) {

  return (

    eventPriority(first) -
    eventPriority(second)

    ||

    timeSortNumber(
      first.startTime
    )
    -
    timeSortNumber(
      second.startTime
    )

    ||

    first.title.localeCompare(

      second.title,

      "zh-CN"

    )

  );

}


/* =========================================================
   SCHOOL HOLIDAY
   ========================================================= */

function isSchoolHoliday(
  activity
) {

  return clean(
    activity.title
  ).includes(
    "学校假期"
  );

}


/* =========================================================
   ACTIVITIES FOR DATE
   ========================================================= */

function activityOn(key) {

  return activities

    .filter(
      activity =>

        activity.date === key

        &&

        matchesSearch(
          activity
        )

    )

    .sort(
      compareActivities
    );

}


/* =========================================================
   RENDER CALENDAR

   Notice:
   TIME IS NOT SHOWN HERE.
   Time only appears in Detail panel.
   ========================================================= */

function renderCalendar() {

  const year =
    viewDate.getFullYear();


  const month =
    viewDate.getMonth();


  $("monthLabel").textContent =
    `${year} 年 ${month + 1} 月`;


  const first =
    new Date(
      year,
      month,
      1
    );


  const start =
    addDays(

      first,

      -first.getDay()

    );


  const todayKey =
    dateKey(
      new Date()
    );


  let html = "";


  for (
    let i = 0;
    i < 42;
    i++
  ) {

    const date =
      addDays(
        start,
        i
      );


    const key =
      dateKey(date);


    const inMonth =
      date.getMonth() === month;


    const events =
      activityOn(key);


    const info =
      infoFor(key);


    const classes =

      "day"

      +

      (
        !inMonth
          ? " outside"
          : ""
      )

      +

      (
        key === todayKey
          ? " today"
          : ""
      )

      +

      (
        key === selectedDate
          ? " selected"
          : ""
      );


    html += `

      <div
        class="${classes}"
        data-date="${key}"
        tabindex="0"
        role="button"
        aria-label="${escapeHTML(key)}"
      >

        <div class="daynum">

          ${date.getDate()}

          ${
            info &&
            info.holiday

            ? '<span class="pill">假期</span>'

            : ""
          }

        </div>


        ${
          info &&
          info.lunar

          ? `

            <div
              style="
                font-size:10px;
                color:#b54747;
                margin-bottom:3px;
              "
            >
              ${escapeHTML(info.lunar)}
            </div>

          `

          : ""
        }


        ${
          events

            .slice(
              0,
              3
            )

            .map(

              event => `

                <span

                  class="
                    event-chip${
                      isSchoolHoliday(event)
                        ? " school-holiday"
                        : ""
                    }
                  "

                  title="
                    ${escapeHTML(event.title)}
                  "

                >

                  ${escapeHTML(event.title)}

                </span>

              `

            )

            .join("")
        }


        ${
          events.length > 3

          ? `

            <span class="event-chip more">

              另有 ${events.length - 3} 项

            </span>

          `

          : ""
        }


        ${
          info &&
          info.holiday

          ? `

            <div
              style="
                font-size:10px;
                color:#9a6a2d;
              "
            >

              ${escapeHTML(info.holiday)}

            </div>

          `

          : ""
        }


      </div>

    `;

  }


  $("days").innerHTML =
    html;


  /* Click date */

  $("days")

    .querySelectorAll(
      ".day"
    )

    .forEach(
      element => {


        const chooseDate =
          () => {


            selectedDate =
              element.dataset.date;


            render();

          };


        element.addEventListener(

          "click",

          chooseDate

        );


        element.addEventListener(

          "keydown",

          event => {


            if (

              event.key === "Enter"

              ||

              event.key === " "

            ) {


              event.preventDefault();


              chooseDate();

            }

          }

        );

      }
    );

}


/* =========================================================
   RECURRENCE DETAIL TEXT
   ========================================================= */

function recurrenceDetail(
  activity
) {

  const mode =
    recurrenceMode(
      activity.recurrence
    );


  /* Don't show Single */

  if (
    !mode ||
    mode === "single"
  ) {

    return "";

  }


  const label =
    recurrenceLabel(
      activity.recurrence
    );


  const untilDate =

    activity.effectiveRepeatUntilty
    );


  if (!untilDate) {

    return label;

  }


  const untilText =
    untilDate
      .toLocaleDateString(

        "zh-MY",

        {

          year:
            "numeric",

          month:
            "long",

          day:
            "numeric"

        }

      );


  return (

    `${label}，至 ${untilText}`

  );

}


/* =========================================================
   EVENT DETAIL CARD
   ========================================================= */

function eventCard(
  activity
) {

  const date =
    fromKey(
      activity.date
    );


  const dateText =

    date

    ? date.toLocaleDateString(

        "zh-MY",

        {

          year:
            "numeric",

          month:
            "short",

          day:
            "numeric",

          weekday:
            "short"

        }

      )

    : activity.date;


  /* NEW: TIME */

  const timeText =
    activityTime(
      activity
    );


  /* NEW: RECURRENCE */

  const repeatText =
    recurrenceDetail(
      activity
    );


  return `

    <article

      class="
        event${
          isSchoolHoliday(activity)
            ? " school-holiday"
            : ""
        }
      "

    >


      <div class="date">

        ${escapeHTML(dateText)}

      </div>


      <h3>

        ${escapeHTML(activity.title)}

      </h3>


      <!-- TIME -->

      ${
        timeText

        ? `

          <p class="event-time">

            <span
              class="event-detail-icon"
              aria-hidden="true"
            >
              ◷
            </span>

            <strong>
              时间：
            </strong>

            ${escapeHTML(timeText)}

          </p>

        `

        : ""
      }


      <!-- RECURRENCE -->

      ${
        repeatText

        ? `

          <p class="event-repeat">

            <span
              class="event-detail-icon"
              aria-hidden="true"
            >
              ↻
            </span>

            <strong>
              重复：
            </strong>

            ${escapeHTML(repeatText)}

          </p>

        `

        : ""
      }


      <!-- CATEGORY -->

      ${
        activity.category

        ? `

          <p>

            <strong>
              类别：
            </strong>

            ${escapeHTML(activity.category)}

          </p>

        `

        : ""
      }


      <!-- LOCATION -->

      ${
        activity.location

        ? `

          <p>

            <strong>
              地点：
            </strong>

            ${escapeHTML(activity.location)}

          </p>

        `

        : ""
      }


      <!-- OWNER -->

      ${
        activity.owner

        ? `

          <p>

            <strong>
              负责人：
            </strong>

            ${escapeHTML(activity.owner)}

          </p>

        `

        : ""
      }


      <!-- DESCRIPTION -->

      ${
        activity.description

        ? `

          <p class="event-description">

            ${escapeHTML(activity.description)}

          </p>

        `

        : ""
      }


    </article>

  `;

}


/* =========================================================
   RENDER EVENT LIST
   ========================================================= */

function renderList() {

  const all =
    activities.filter(
      matchesSearch
    );


  let list;

  let title;


  /* Selected date */

  if (
    selectedDate
  ) {

    list =
      all.filter(

        activity =>
          activity.date ===
          selectedDate

      );


    const selected =
      fromKey(
        selectedDate
      );


    title =

      selected

      ? `${selected.toLocaleDateString(

          "zh-MY",

          {

            year:
              "numeric",

            month:
              "long",

            day:
              "numeric"

          }

        )} 的活动`

      : `${selectedDate} 的活动`;

  }


  /* Entire month */

  else {

    list =
      all.filter(

        activity => {


          const date =
            fromKey(
              activity.date
            );


          return (

            date

            &&

            date.getFullYear() ===
            viewDate.getFullYear()

            &&

            date.getMonth() ===
            viewDate.getMonth()

          );

        }

      );


    title =

      searchTerm

      ? "搜索结果"

      : `${viewDate.getFullYear()} 年 ${viewDate.getMonth() + 1} 月活动`;

  }


  /* Sort by date then priority/time */

  list.sort(

    (
      first,
      second
    ) =>

      first.date.localeCompare(
        second.date
      )

      ||

      compareActivities(
        first,
        second
      )

  );


  $("listTitle").textContent =
    title;


  $("resultCount").textContent =
    `${list.length} 项`;


  /* Empty */

  if (
    !list.length
  ) {

    $("eventList").innerHTML = `

      <div class="empty">

        ${
          searchTerm

          ? "没有找到符合条件的活动。"

          : "这一天 / 这个月份暂时没有活动。"
        }

      </div>

    `;


    return;

  }


  /* Render */

  $("eventList").innerHTML =

    list

      .slice(
        0,
        150
      )

      .map(
        eventCard
      )

      .join("")

    +

    (

      list.length > 150

      ? `

        <div class="empty">

          仅显示前 150 项，请缩小搜索范围。

        </div>

      `

      : ""

    );

}


/* =========================================================
   MAIN RENDER
   ========================================================= */

function render() {

  renderCalendar();

  renderList();

}


/* =========================================================
   PREVIOUS MONTH
   ========================================================= */

$("prevBtn")
  .addEventListener(

    "click",

    () => {


      viewDate =
        new Date(

          viewDate.getFullYear(),

          viewDate.getMonth() - 1,

          1

        );


      selectedDate = "";


      render();

    }

  );


/* =========================================================
   NEXT MONTH
   ========================================================= */

$("nextBtn")
  .addEventListener(

    "click",

    () => {


      viewDate =
        new Date(

          viewDate.getFullYear(),

          viewDate.getMonth() + 1,

          1

        );


      selectedDate = "";


      render();

    }

  );


/* =========================================================
   TODAY
   ========================================================= */

$("todayBtn")
  .addEventListener(

    "click",

    () => {


      const now =
        new Date();


      viewDate =
        new Date(

          now.getFullYear(),

          now.getMonth(),

          1

        );


      selectedDate =
        dateKey(now);


      render();

    }

  );


/* =========================================================
   MANUAL REFRESH
   ========================================================= */

$("refreshBtn")
  .addEventListener(

    "click",

    loadData

  );


/* =========================================================
   SEARCH
   ========================================================= */

$("searchInput")
  .addEventListener(

    "input",

    event => {


      searchTerm =

        event.target.value

          .trim()

          .toLowerCase();


      render();

    }

  );


/* =========================================================
   INITIAL LOAD
   ========================================================= */

render();

loadData();


/* =========================================================
   AUTOMATIC REFRESH
   Every 5 minutes
   ========================================================= */

setInterval(

  loadData,

  5 * 60 * 1000

);

</script>

</body>
</html>
