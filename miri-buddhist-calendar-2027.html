function validDate(y,m,d){const x=new Date(y,m-1,d);return x.getFullYear()===y&&x.getMonth()===m-1&&x.getDate()===d?x:null}

async function loadData(){$("refreshBtn").disabled=true;$("loadStatus").textContent="正在载入…";$("errorBox").style.display="none";try{const rows=await fetchCSV(ACTIVITY_CSV_URL),parsed=detectActivities(rows);if(!parsed.length)throw new Error("已连接 CSV，但无法识别活动日期或活动名称。请检查表头。");activities=expandActivities(parsed);try{dateInfo=clean(DATE_INFO_CSV_URL)?parseDateInfo(await fetchCSV(DATE_INFO_CSV_URL)):[]}catch(e){console.warn("日期附加资料无法载入",e);dateInfo=[]}$("loadStatus").textContent=`成功载入 ${parsed.length} 项活动`;render()}catch(e){console.error(e);$("loadStatus").textContent="载入失败";$("errorBox").textContent="活动资料载入失败：\n"+e.message;$("errorBox").style.display="block";$("eventList").innerHTML='<div class="empty">暂时无法显示活动。请检查资料连接后再刷新。</div>'}finally{$("refreshBtn").disabled=false}}
function infoFor(k){return dateInfo.find(x=>x.date===k)}function matchesSearch(a){return!searchTerm||[a.title,a.category,a.location,a.owner,a.description,a.startTime,a.endTime,recurrenceLabel(a.recurrence)].join(" ").toLowerCase().includes(searchTerm)}function eventPriority(a){const t=clean(a.title);return t.includes("开斋节")?1:t.includes("学校假期")?2:t.includes("青年团")?3:4}function compareActivities(a,b){return eventPriority(a)-eventPriority(b)||timeSortNumber(a.startTime)-timeSortNumber(b.startTime)||a.title.localeCompare(b.title,"zh-CN")}function isSchoolHoliday(a){return clean(a.title).includes("学校假期")}function activityOn(k){return activities.filter(a=>a.date===k&&matchesSearch(a)).sort(compareActivities)}
function renderCalendar(){const y=viewDate.getFullYear(),m=viewDate.getMonth();$("monthLabel").textContent=`${y} 年 ${m+1} 月`;const start=addDays(new Date(y,m,1),-new Date(y,m,1).getDay()),today=dateKey(new Date());let html="";for(let i=0;i<42;i++){const d=addDays(start,i),k=dateKey(d),events=activityOn(k),info=infoFor(k),cls="day"+(d.getMonth()!==m?" outside":"")+(k===today?" today":"")+(k===selectedDate?" selected":"");html+=`<div class="${cls}" data-date="${k}" tabindex="0" role="button" aria-label="${k}"><div class="daynum">${d.getDate()} ${info&&info.holiday?'<span class="pill">假期</span>':""}</div>${info&&info.lunar?`<div style="font-size:10px;color:#b54747;margin-bottom:3px">${escapeHTML(info.lunar)}</div>`:""}${events.slice(0,3).map(e=>`<span class="event-chip${isSchoolHoliday(e)?" school-holiday":""}" title="${escapeHTML(e.title)}">${escapeHTML(e.title)}</span>`).join("")}${events.length>3?`<span class="event-chip more">另有 ${events.length-3} 项</span>`:""}${info&&info.holiday?`<div style="font-size:10px;color:#9a6a2d">${escapeHTML(info.holiday)}</div>`:""}</div>`}$("days").innerHTML=html;$("days").querySelectorAll(".day").forEach(el=>{const choose=()=>{selectedDate=el.dataset.date;render()};el.addEventListener("click",choose);el.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();choose()}})})}
function recurrenceDetail(a){const mode=recurrenceMode(a.recurrence);if(!mode||mode==="single")return"";const until=a.effectiveRepeatUntil||effectiveRepeatUntil(a);return`${recurrenceLabel(a.recurrence)}，至 ${until.toLocaleDateString("zh-MY",{year:"numeric",month:"long",day:"numeric"})}`}
function eventCard(a){const d=fromKey(a.date),dateText=d?d.toLocaleDateString("zh-MY",{year:"numeric",month:"short",day:"numeric",weekday:"short"}):a.date,time=activityTime(a),repeat=recurrenceDetail(a);return`<article class="event${isSchoolHoliday(a)?" school-holiday":""}"><div class="date">${escapeHTML(dateText)}</div><h3>${escapeHTML(a.title)}</h3>${time?`<p class="event-time"><span class="event-detail-icon">◷</span><strong>时间：</strong>${escapeHTML(time)}</p>`:""}${repeat?`<p class="event-repeat"><span class="event-detail-icon">↻</span><strong>重复：</strong>${escapeHTML(repeat)}</p>`:""}${a.category?`<p><strong>类别：</strong>${escapeHTML(a.category)}</p>`:""}${a.location?`<p><strong>地点：</strong>${escapeHTML(a.location)}</p>`:""}${a.owner?`<p><strong>负责人：</strong>${escapeHTML(a.owner)}</p>`:""}${a.description?`<p class="event-description">${escapeHTML(a.description)}</p>`:""}</article>`}
function renderList(){const all=activities.filter(matchesSearch);let list,title;if(selectedDate){list=all.filter(a=>a.date===selectedDate);title=`${selectedDate} 的活动`}else{list=all.filter(a=>{const d=fromKey(a.date);return d&&d.getFullYear()===viewDate.getFullYear()&&d.getMonth()===viewDate.getMonth()});title=searchTerm?"搜索结果":`${viewDate.getFullYear()} 年 ${viewDate.getMonth()+1} 月活动`}list.sort((a,b)=>a.date.localeCompare(b.date)||compareActivities(a,b));$("listTitle").textContent=title;$("resultCount").textContent=`${list.length} 项`;$("eventList").innerHTML=list.length?list.slice(0,150).map(eventCard).join("")+(list.length>150?'<div class="empty">仅显示前 150 项，请缩小搜索范围。</div>':""):`<div class="empty">${searchTerm?"没有找到符合条件的活动。":"这一天 / 这个月份暂时没有活动。"}</div>`}
function render(){renderCalendar();renderList()}
$("prevBtn").addEventListener("click",()=>{viewDate=new Date(viewDate.getFullYear(),viewDate.getMonth()-1,1);selectedDate="";render()});$("nextBtn").addEventListener("click",()=>{viewDate=new Date(viewDate.getFullYear(),viewDate.getMonth()+1,1);selectedDate="";render()});$("todayBtn").addEventListener("click",()=>{const n=new Date();viewDate=new Date(n.getFullYear(),n.getMonth(),1);selectedDate=dateKey(n);render()});$("refreshBtn").addEventListener("click",loadData);$("searchInput").addEventListener("input",e=>{searchTerm=e.target.value.trim().toLowerCase();render()});render();loadData();setInterval(loadData,5*60*1000);
</script>
</body>
</html>
